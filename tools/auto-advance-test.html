<!DOCTYPE html><html><head><meta charset="utf-8"><title>自动跳转流程回归</title></head><body>
<iframe id="f" src="../play.html?theme=animals" style="width:1200px;height:900px"></iframe>
<pre id="out">PENDING</pre>
<script>
const log=[];const f=document.getElementById('f');
window.onerror=(m,u,l)=>{document.getElementById('out').textContent='ERROR '+m+' @'+l;};
const cur=()=>{const a=[...f.contentDocument.querySelectorAll('.tab-btn')].find(b=>b.classList.contains('active'));return a?a.id:'-';};
function ready(){try{return f.contentDocument&&f.contentDocument.querySelector('.hotspot')}catch(e){return null}}
function wait(){
  if(!ready()){setTimeout(wait,100);return;}
  const d=f.contentDocument;
  // 屏蔽语音，避免等配音；直接触发 onEnded 三个玩法自动跳需要音效回调，故这里不屏蔽
  d.getElementById('tab-quiz').click();
  setTimeout(()=>{
    for(let i=0;i<3;i++){const c=d.querySelector('#quiz-options .quiz-option[data-correct="1"]');if(c)c.click();}
    log.push('答完3题后当前tab='+cur());
    // 自动跳独立计时 3.5 秒
    setTimeout(()=>{log.push('等待后tab='+cur()+'(期望tab-match)');
      // 在配对里直接完成，测自动跳故事
      const cards=[...d.querySelectorAll('.drag-card')];
      cards.forEach(c=>{const s=d.querySelector('.drop-slot[data-accept="'+c.dataset.match+'"]');if(s&&!s.classList.contains('filled')){c.click();s.click();}});
      log.push('配对完成后tab='+cur());
      setTimeout(()=>{log.push('等待后tab='+cur()+'(期望tab-story)');
        document.getElementById('out').textContent='RESULT\n'+log.join('\n');
      },4500);
    },4500);
  },300);
}
wait();
</script></body></html>
