<!DOCTYPE html><html><head><meta charset="utf-8"><title>语音回归：正常节奏下题干与鼓励语依次播放</title></head><body>
<iframe id="f" src="../play.html?theme=animals" style="width:1200px;height:900px"></iframe>
<pre id="out">PENDING</pre>
<script>
const log=[];const f=document.getElementById('f');
f.onload=()=>{
  const w=f.contentWindow,d=f.contentDocument;
  const os=w.speechSynthesis.speak.bind(w.speechSynthesis);
  w.speechSynthesis.speak=(u)=>{log.push('FALLBACK:'+u.text);try{os(u)}catch(e){}};
  const OA=w.Audio;w.Audio=function(s){log.push('PLAY:'+s);return new OA(s)};w.Audio.prototype=OA.prototype;
  setTimeout(()=>{
    d.getElementById('tab-quiz').click();
    setTimeout(()=>{
      d.querySelector('#quiz-options .quiz-option[data-correct="1"]').click(); // 答对第1题
      setTimeout(()=>{
        document.getElementById('out').textContent='RESULT\n'+log.join('\n');
      },4000); // 等鼓励语(~1.5s)播完 + 题干播出
    },300);
  },800);
};
</script></body></html>
