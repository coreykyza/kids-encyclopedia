<!DOCTYPE html><html><head><meta charset="utf-8"><style>body{margin:0}iframe{width:1000px;height:1000px;border:0}</style></head><body>
<iframe id="f" src="../play.html?theme=animals"></iframe>
<script>
document.getElementById('f').onload=()=>{
  const d=document.getElementById('f').contentDocument;
  if(!d.getElementById('tab-quiz'))return;
  if(!location.hash){d.getElementById('tab-quiz').click();location.hash='quiz';}
  else if(location.hash==='#match'){d.getElementById('tab-match').click();}
};
</script></body></html>
